[package]
name = "meinspiel"
version = "0.1.0"
edition = "2021"
description = "MEIN SPIEL"

[workspace]
members = [".", "mettgine", "mettgine/mpak", "mettgine/mettpack"]
# `cargo test` prueft Spiel und Engine
default-members = [".", "mettgine", "mettgine/mpak", "mettgine/mettpack"]

[dependencies]
# Weitere Engine-Teile bei Bedarf: features = ["gltf", "physics", "audio-files", "ecs"]
mettgine = { path = "mettgine" }
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }

[profile.release]
# Zeilennummern fuer Absturzberichte (landen in der .pdb neben der exe, nicht in der exe)
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
